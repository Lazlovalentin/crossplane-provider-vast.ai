apiVersion: account.vastai.crossplane.io/v1alpha1
kind: APIKey
metadata:
  annotations:
    meta.upbound.io/example-id: account/v1alpha1/apikey
  labels:
    testing.upbound.io/example-name: ci_deploy
  name: ci-deploy
spec:
  forProvider:
    name: ci-deploy-key
    permissions: |-
      ${jsonencode({
          "instances" : "full",
          "ssh_keys" : "read",
          "templates" : "read"
        })}
