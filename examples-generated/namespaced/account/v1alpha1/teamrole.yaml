apiVersion: account.vastai.m.crossplane.io/v1alpha1
kind: TeamRole
metadata:
  annotations:
    meta.upbound.io/example-id: account/v1alpha1/teamrole
  labels:
    testing.upbound.io/example-name: developer
  name: developer
  namespace: crossplane-system
spec:
  forProvider:
    name: developer
    permissions: |-
      ${jsonencode({
          "api" = {
            "instance_read"  = {}
            "instance_write" = {}
            "template_read"  = {}
            "ssh_key_read"   = {}
          }
        })}
